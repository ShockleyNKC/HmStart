 <script>
// 1. 檢查外部 DATA.js 是否成功讀入
let isExternal = false;

  Raw_DATA = window.EXTERNAL_DATA;
  isExternal = true;
}

let Msg0 = '';
let Msg1 = '';
let DSrc = '';

const isValidRaw = Raw_DATA && typeof Raw_DATA === 'object' && !Array.isArray(Raw_DATA);
const cachedDTime1 = localStorage.getItem('DTime1');
const rawDTime1 = isValidRaw ? String(Raw_DATA.DTime1 || '').trim() : '';


if (isNewerMMDD(rawDTime1, cachedDTime1)) {
  if (isValidRaw) {
    Object.entries(Raw_DATA).forEach(([k, v]) => {
      localStorage.setItem(k, String(v));
    });
    // 區分來源：E=外部DATA.js、D=內建初始資料    
    DSrc = isExternal ? 'E' : 'D';
    localStorage.setItem('DSrc', DSrc);
    Msg0 = (cachedDTime1 === null) ? '已載入初始資料 D ' : `已更新最新資料 E  (${rawDTime1})`;
  } else {
    DSrc = 'X';
    Msg0 = '格式錯誤或為空 X';
  }
} else {
  DSrc = 'M';
  Msg0 = `已讀入記憶資料 M (${cachedDTime1})`;
}

// ------------ mLast.mThis--mNext ------------
//              RM1   RM2(TxtNew)
// rebuild RList
var regex    = /^(2025|2026|2027)\d{2}$/; // YYYYMM
var allKeys  = Object.keys(localStorage || {});
var RecMn    = allKeys.filter(key => regex.test(key));
    RecMn.sort();
var RList    = RecMn.join(' ');
    localStorage.setItem('RList',RList);  // reset RList
var mLast    = RecMn.at(-2);  // 202605
var mThis    = RecMn.at(-1);  // 202606 last rec in RList
var mNext    = Number(mThis) + ((mThis.slice(-2)=='12') ? 89:1) + ''; // 202607
var MO       = `${mNext.slice(0,4)}-${mNext.slice(4)}`;               // 2026-07
var RecEnd   = true;          // when mThis = last record
var RecMni   = RecMn.indexOf(mThis);
var TxtOld   = localStorage.getItem(mThis);    // latest record
var TxtNew   = localStorage.getItem('TxtNew'); // includes adj
var DTime    = localStorage.getItem('DTime');  // Data Time
var DTime1   = localStorage.getItem('DTime1'); // Data Chg time
var isTxtChg = DTime !== DTime1 ;            // Data chg flag
var RM1 = localStorage.getItem(mLast);    // Data Last Mn
var RM2 = TxtNew;                         // Data This Mn
var AL  = 65; // Room count : 38,16,11=60+5(39101,39202,39900,40900,43900)
var AR1 = [], AR2 = [];             // Rm record

let isManualReloading = false; // 防止 svJN() 重整時重複覆寫 DTime1

// 統一產生 MMDD.HHmm 格式時間
function getNowMMDDHHmm() {
  const d = new Date();
  const MM = String(d.getMonth() + 1).padStart(2, '0');
  const DD = String(d.getDate()).padStart(2, '0');
  const HH = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${MM}${DD}.${HH}${mm}`;
}

// 離開或切換分頁時：只更新 DTime1（快取最後存取時間），不動 DTime（備份時間）
function syncCacheLastTime() {
  if (isManualReloading) return; // 剛執行完 svJN() 準備重整，跳過此次更新
  const currentDSrc = localStorage.getItem('DSrc');
  if (!currentDSrc || currentDSrc === 'X') return;

  localStorage.setItem('DTime1', getNowMMDDHHmm());
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') syncCacheLastTime();
});
window.addEventListener('pagehide', syncCacheLastTime);


// 判斷 rawDTime1 是否比 cachedDTime1 更新（含跨年處理）
function isNewerMMDD(rawStr, cacheStr) {
  if (!cacheStr) return true; // 無快取，直接載入
  if (!rawStr) return false;  // 新資料無時間戳，不覆蓋
  
  const rawNum = parseFloat(rawStr);
  const cacheNum = parseFloat(cacheStr);
  if (isNaN(rawNum) || isNaN(cacheNum)) return rawStr !== cacheStr;

  // 正常同一年內：新時間大於舊時間
  if (rawNum > cacheNum) return true;

  // 跨年情況：快取在年底 (11~12月)，新資料在年初 (1~2月)
  if (cacheNum >= 1100 && rawNum <= 299) return true;

  return false;
}
// 01.-------- gData() ------------
function gData()
{ AR1 = RM1.split("\n"); // Last Reading
  for (let i=0; i<AL; i++) {AD1[i]=AR1[i].split(",");} //LastRmData
  AR2 = RM2.split("\n"); // This Reading
  for (let i=0; i<AL; i++) {AD2[i]=AR2[i].split(",");} //ThisRmData
}
// ------ gData(). -------
//
// 02.--------  Last Month ------------
function LastMo()
{ 
  if (RecMni<2) { return; }
  else
  { RecMni = RecMni - 1;
    RecEnd = false ;
    mLast = RecMn[RecMni-1];
    mThis = RecMn[RecMni];
    mNext = RecMn[RecMni+1];
    MO = mNext.slice(0,4)+'-'+mNext.slice(4);
    RM2 = localStorage.getItem(mThis);
    RM1 = localStorage.getItem(mLast); // LastMo
  }
}
// ------ LastMo(). -------
//
// 03.--------  Next Month ------------
function NextMo()
{ if (RecMni>(RecMn.length-2)) { return; }
  else
  { RecMni = RecMni + 1;
    RecEnd = (RecMni === RecMn.length-1) ;
    mLast = RecMn[RecMni-1];
    mThis = RecMn[RecMni];
    mNext = RecEnd ? (Number(mThis) + ((mThis.slice(-2)==='12') ?
      89:1)+'').trim() : RecMn[RecMni+1] ;
    MO = mNext.slice(0,4)+'-'+mNext.slice(4);
    RM1 = localStorage.getItem(mLast);
    RM2 = RecEnd ? TxtNew : localStorage.getItem(mThis); // ThisMo
  }
} 
// ------- NextMo(). -------
//
// 04. ---- KeyUpIP() -----------------------
function KeyUpIP(ipINFO) {
  const N = ipINFO.value;
  if (N.length === 4) { 
    const hse = $(ipINFO).attr('data-hse');
    const field = $(ipINFO).attr('data-field');
    const i = AD2.findIndex(row => row?.[0] === hse);
    
    if (i > -1) { // Rm found
      let fieldIdx;
      if      (field === 'W_Meter') fieldIdx = 3;
      else if (field === 'E_Meter') fieldIdx = 4;
      else if (field === 'PDt')     fieldIdx = 1;
      
      if (fieldIdx !== undefined) { 
        AD2[i][fieldIdx] = N;
        isTxtChg = true;
      }
      
      if (isTxtChg) { 
        TxtNew = AD2.map(row => row.join(",")).join("\n");
        localStorage.setItem('TxtNew', TxtNew);
        const d = new Date();
        DTime1 = DT0.slice(-4) + '.' + 
                 String(d.getHours()).padStart(2, '0') + 
                 String(d.getMinutes()).padStart(2, '0');
        localStorage.setItem('DTime1', DTime1);
        updtRm(hse);   // update with RMN
        fillPage();
      }
    }     // Rm found,edit & update
  }       // Data entry comp for process
}

// ---- KeyUpIP -- end -----------

// Initialize variables complete

function getTouches(evt) 
 { return evt.touches || evt.originalEvent.touches; }
// B10b. ----  Touch Events ----------
function handleTouchStart(evt)
 { const firstTouch=getTouches(evt)[0];
   xDown=firstTouch.clientX;
   yDown=firstTouch.clientY; }
// B10c. ----  Touch Events ----------
function handleTouchMoveH(evt) 
 { if ( ! xDown || ! yDown) { return; }
   var xUp = evt.touches[0].clientX;
   var yUp = evt.touches[0].clientY;
   var xDiff = xDown - xUp;
   var yDiff = yDown - yUp;
   if ( Math.abs(xDiff) > Math.abs(yDiff) )
    { if (xDiff > 0) { RmNext();}  // Left  > Next Rm
        else { RmLast();}}         // Right > Last Rm
    xDown = null;   // reset values 
    yDown = null; 
 } 
// B10d. ----  Touch Events ---------- 
function handleTouchMoveV(evt) 
 { if ( ! xDown || ! yDown) { return; }
   var xUp = evt.touches[0].clientX;
   var yUp = evt.touches[0].clientY;
   var xDiff = xDown - xUp;
   var yDiff = yDown - yUp;
   if ( Math.abs(xDiff) < Math.abs(yDiff) )

 }

// C12 ShowDiff() 渲染差異比對 ------------------
function ShowDiff(isCompareOnly = false)
{ const selectionStart = RM33v.selectionStart;
  const selectionEnd   = RM33v.selectionEnd;
  const currentText    = RM33v.value; 
  TxtNew = currentText; 
  isTxtChg = (currentText !== TxtOld);
  if (currentView === "old") { return; }
  const escapeHTML = str => str.replace(/&/g, '&amp;').
    replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let htmlResult = "";
  let isChanged = false;
  const diffs = getTextDiff(TxtOld, currentText);
  let i = 0;
  while (i < diffs.length)
  { let currentType = diffs[i].type;
    let combinedValue = "";
    while (i < diffs.length && diffs[i].type === currentType) 
    { combinedValue += diffs[i].value;
      i++;  }
    const displayStr = escapeHTML(combinedValue);
    
    if (currentType === 'equal') 
    { htmlResult += displayStr; }
    else if (currentType === 'insert') 
    { // 新增文字：紅色背景
      htmlResult += `<span style="color:red;
        background-color:rgba(0,255,0,0.1);
        font-weight:bold;">${displayStr}</span>`;
      isChanged = true; }
    else if (currentType === 'delete') 
    { // 放棄顯示刪除內容：直接跳過
    } } 
  RM33vHL.innerHTML = htmlResult + (currentText.endsWith('\n') ? ' ' : '');
  RM33v.setSelectionRange(selectionStart, selectionEnd);

  if (!isCompareOnly && isChanged && isTxtChg)
  { const d = new Date();
    DTime1 = DT0.slice(-4) + '.' + 
             String(d.getHours()).padStart(2, '0') + 
             String(d.getMinutes()).padStart(2, '0');
    localStorage.setItem('DTime1', DTime1);
    localStorage.setItem('TxtNew', currentText);
    RM2 = currentText;
    gData();
    B30.style.backgroundColor = "lightPink";
    T31.innerHTML = DTime1 || '';
    gINFO34.innerHTML = `✏️ 內容已修改`; }
}

async function svJN() {
  // 改用統一時間函式，避免跨日分頁未關導致日期停留在舊的 DT0
  DTime1 = getNowMMDDHHmm();
  DTime = DTime1;   // 正式備份時，同步重設備份時間 DTime
  RM2 = TxtNew;     // updt RM2

  // 1. 更新 localStorage
  localStorage.setItem(mThis, RM2);
  localStorage.setItem('DSrc', 'F');
  localStorage.setItem('DTime', DTime);
  localStorage.setItem('DTime1', DTime1);

  // 2. 打包資料（排除不需要匯出的暫存鍵值，如 TxtNew）
 // const excludeKeys = ['TxtNew'];
  const excludeKeys = []; 
  const exportObj = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!excludeKeys.includes(key)) {
      exportObj[key] = localStorage.getItem(key);
    }
  }
  const data = JSON.stringify(exportObj, null, 2);

  // 3. 下載 JSON 歷史備份檔
  const blob = new Blob([data], { type: 'application/json' });
  const downloadFN = `Data-${DTime1}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = downloadFN;
  a.click();
  URL.revokeObjectURL(a.href);

  // 4. 輸出覆蓋 DATA.js
  const jsContent = `window.EXTERNAL_DATA = \n${data};\n`;
  let isSavedJS = false;

  try {
    if ('showSaveFilePicker' in window) {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'DATA.js',
        types: [{
          description: 'JavaScript Data File',
          accept: { 'application/javascript': ['.js'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(jsContent);
      await writable.close();
      isSavedJS = true;
    } else {
      const jsBlob = new Blob([jsContent], { type: 'application/javascript;charset=utf-8' });
      const aJs = document.createElement('a');
      aJs.href = URL.createObjectURL(jsBlob);
      aJs.download = 'DATA.js';
      aJs.click();
      URL.revokeObjectURL(aJs.href);
      isSavedJS = true;
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      gINFO34.innerHTML = `⚠️ 已備份 ${downloadFN}，但取消覆蓋 DATA.js`;
    } else {
      console.error('儲存 DATA.js 發生錯誤：', err);
      gINFO34.innerHTML = `❌ 覆蓋 DATA.js 失敗`;
    }
    return; // 取消或失敗時不自動重新整理頁面
  }

  // 5. 成功後更新 UI 並重新整理
  if (isSavedJS) {
    B30.style.backgroundColor = ""; 
    T31.innerHTML = ''; 
    T30.innerHTML = DTime;
    gINFO34.innerHTML = `✅ 已匯出 ${downloadFN} 與 DATA.js`; 
    
    isManualReloading = true; // 鎖定，避免 reload 觸發 pagehide 改動剛存好的 DTime1
    setTimeout(() => { window.location.reload(); }, 1500);
  }
}

// 🟢 核心優化：輕量級 Myers Diff 演算法 (用於精準比對字元)
// C18 getTextDiff() ----------------------------------
function getTextDiff(oldStr, newStr) 
{
  let matrix = Array(oldStr.length + 1).fill(null).map(() =>
    Array(newStr.length + 1).fill(0));
  for (let i = 1; i <= oldStr.length; i++)
    { for (let j = 1; j <= newStr.length; j++)
      { if (oldStr[i - 1] === newStr[j - 1])
        { matrix[i][j] = matrix[i - 1][j - 1] + 1; }
        else
        { matrix[i][j] = Math.max(matrix[i - 1][j], matrix[i][j - 1]); }
      }
    }
  let i = oldStr.length, j = newStr.length;
  let result = [];
  while (i > 0 || j > 0) 
    { if (i > 0 && j > 0 && oldStr[i - 1] === newStr[j - 1])
      { result.unshift({ type: 'equal', value: oldStr[i - 1] });
        i--; j--; }
      else if (j > 0 && (i === 0 || matrix[i][j - 1] >= matrix[i - 1][j])) 
      { result.unshift({ type: 'insert', value: newStr[j - 1] });
        j--; }
      else
      { result.unshift({ type: 'delete', value: oldStr[i - 1] });
        i--; }
    }
  return result;
}

//  判斷 jQuery 是否存在
window.addEventListener('load', function() 
{ const checker = document.getElementById('jquery-checker');
  if (typeof window.jQuery === 'undefined')
  { checker.style.backgroundColor = '#fff3f3';
    checker.style.border = '1px solid #ffcdd2';
    checker.style.color = '#c62828';
    checker.innerHTML = '❌ <b>jQuery 狀態：</b> 載入失敗！所有備援皆無法連接。';
    return; }
  const version = window.jQuery.fn.jquery;
  let detectedSrc = '未知來源';
  let isCached = false;
  const resources = performance.getEntriesByType('resource');
  const jqResource = resources.find(r => r.name.toLowerCase().includes('jquery'));
  if (jqResource) 
  { const url = jqResource.name;
    if (url.includes('://cloudflare.com')) 
    { detectedSrc = '🌐 Cloudflare CDN'; }
    else if (url.includes('://googleapis.com'))
    { detectedSrc = '🌐 Google CDN'; }
    else if (url.includes('jquery.com') &&
      !url.includes('cdnjs') && !url.includes('google'))
    { detectedSrc = '🌐 jQuery 官網 (首頁錯誤網址)'; }
    else if (url.startsWith('file://') ||
      url.startsWith('content://') || url.includes('jquery.min.js'))
    { detectedSrc = '📁 本地檔案 (Local File)'; }
    else
    { detectedSrc = url; }
    if (jqResource.transferSize === 0 && jqResource.encodedBodySize > 0)
    { isCached = true; } }
    else
    { detectedSrc = '🧠 瀏覽器內存暫存 (RAM / Memory Session)';
    isCached = true; }
  checker.style.backgroundColor = '#e8f5e9';
  checker.style.border = '1px solid #c8e6c9';
  checker.style.color = '#2e7d32';
  checker.innerHTML = `
    ✅ <b>jQuery  v${version} </b>載入成功！<br>
    🔹 <b>載入來源：</b> ${detectedSrc}<br>
    🔹 <b>快取狀態：</b> ${isCached ? 
      '⚡ 來自快取 (Offline Cache/RAM)' : '📡 即時網路下載 (Live Network)'} `;
});
