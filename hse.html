var yDown = null;
// B10a. ----  Touch Events ----------
function getTouches(evt) 
 { return evt.touches || evt.originalEvent.touches; }
// B10b. ----  Touch Events ----------
function handleTouchStart(evt)
 { const firstTouch=getTouches(evt)[0];
   xDown=firstTouch.clientX;
   yDown=firstTouch.clientY; }
// B10c. ----  Touch Events ----------
function handleTouchMoveH(evt) 
 { if ( ! xDown || ! yDown) { return; }
   var xUp = evt.touches[0].clientX;
   var yUp = evt.touches[0].clientY;
   var xDiff = xDown - xUp;
   var yDiff = yDown - yUp;
   if ( Math.abs(xDiff) > Math.abs(yDiff) )
    { if (xDiff > 0) { RmNext();}  // Left  > Next Rm
        else { RmLast();}}         // Right > Last Rm
    xDown = null;   // reset values 
    yDown = null; 
 } 
// B10d. ----  Touch Events ---------- 
function handleTouchMoveV(evt) 
 { if ( ! xDown || ! yDown) { return; }
   var xUp = evt.touches[0].clientX;
   var yUp = evt.touches[0].clientY;
   var xDiff = xDown - xUp;
   var yDiff = yDown - yUp;
   if ( Math.abs(xDiff) < Math.abs(yDiff) )
    { if (yDiff < 0) { mL = Number(mLast) -

        if (RList.indexOf(mL)>0)

  select.innerHTML = '<option value="">-- 請選擇 --</option>';
  //const keys = Object.keys(localStorage).sort();    // sort only

// C12 ShowDiff() 渲染差異比對 ------------------
function ShowDiff(isCompareOnly = false)
{ const selectionStart = RM33v.selectionStart;
  const selectionEnd   = RM33v.selectionEnd;
  const currentText    = RM33v.value; 
  TxtNew = currentText; 
  isTxtChg = (currentText !== TxtOld);
  if (currentView === "old") { return; }
  const escapeHTML = str => str.replace(/&/g, '&amp;').
    replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let htmlResult = "";
  let isChanged = false;
  const diffs = getTextDiff(TxtOld, currentText);
  let i = 0;
  while (i < diffs.length)
  { let currentType = diffs[i].type;
    let combinedValue = "";
    while (i < diffs.length && diffs[i].type === currentType) 
    { combinedValue += diffs[i].value;
      i++;  }
    const displayStr = escapeHTML(combinedValue);
    
    if (currentType === 'equal') 
    { htmlResult += displayStr; }
    else if (currentType === 'insert') 
    { // 新增文字：紅色背景
      htmlResult += `<span style="color:red;
        background-color:rgba(0,255,0,0.1);
        font-weight:bold;">${displayStr}</span>`;
      isChanged = true; }
    else if (currentType === 'delete') 
    { // 放棄顯示刪除內容：直接跳過
    } } 
  RM33vHL.innerHTML = htmlResult + (currentText.endsWith('\n') ? ' ' : '');
  RM33v.setSelectionRange(selectionStart, selectionEnd);

  if (!isCompareOnly && isChanged && isTxtChg)
  { const d = new Date();
    DTime1 = DT0.slice(-4) + '.' + 
             String(d.getHours()).padStart(2, '0') + 
             String(d.getMinutes()).padStart(2, '0');
    localStorage.setItem('DTime1', DTime1);
    localStorage.setItem('TxtNew', currentText);
    RM2 = currentText;
    gData();
    B30.style.backgroundColor = "lightPink";
    T31.innerHTML = DTime1 || '';
    gINFO34.innerHTML = `✏️ 內容已修改`; }
}

function toggleView()
{ if (!RM33v.value) return;
  B30.style.transition = "1s";
  if (currentView === "diff")
  { currentView = "old";
    RM33v.readOnly = true; // 鎖定輸入防止污染基準
    RM33v.value = TxtOld;
    RM33vHL.innerHTML = TxtOld.replace(/&/g, '&amp;').
      replace(/</g, '&lt;').replace(/>/g, '&gt;');
    B30.style.backgroundColor = "lightCyan";
    T31.innerHTML = '';
    gINFO34.innerHTML = `🔒 原始基準文字` ; }
  else
  { currentView = "diff";
    RM33v.readOnly = false; // 解鎖輸入
    RM33v.value = TxtNew || TxtOld; 
    
    ShowDiff(true); // ✨ 在這裡加入 true！切換檢視純比對，不更新 DTime1
    
    if (isTxtChg) 
    { B30.style.backgroundColor = "lightPink";
      T31.innerHTML = DTime1 || '';
      gINFO34.innerHTML = `✏️ 修改後文字` ;} 
    else 
    { B30.style.backgroundColor = "lightCyan";
      T31.innerHTML = '';
      gINFO34.innerHTML = `👁️ 內容沒有修改`;
      setTimeout(() =>
      { if (currentView === "diff" && !isTxtChg) 
        { gINFO34.innerHTML = `✏️ 進入對比模式`; } }, 1500); } }
}

// C15 svJN() ⬆️ SV 保留並備份 ---------------------
async function svJN() {
  // 改用統一時間函式，避免跨日分頁未關導致日期停留在舊的 DT0
  DTime1 = getNowMMDDHHmm();
  DTime = DTime1;   // 正式備份時，同步重設備份時間 DTime
  RM2 = TxtNew;     // updt RM2

  // 1. 更新 localStorage
  localStorage.setItem(mThis, RM2);
  localStorage.setItem('DSrc', 'F');
  localStorage.setItem('DTime', DTime);
  localStorage.setItem('DTime1', DTime1);

  // 2. 打包資料（排除不需要匯出的暫存鍵值，如 TxtNew）
 // const excludeKeys = ['TxtNew'];
  const excludeKeys = []; 
  const exportObj = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!excludeKeys.includes(key)) {
      exportObj[key] = localStorage.getItem(key);
    }
  }
  const data = JSON.stringify(exportObj, null, 2);

  // 3. 下載 JSON 歷史備份檔
  const blob = new Blob([data], { type: 'application/json' });
  const downloadFN = `Data-${DTime1}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = downloadFN;
  a.click();
  URL.revokeObjectURL(a.href);

  // 4. 輸出覆蓋 DATA.js
  const jsContent = `window.EXTERNAL_DATA = \n${data};\n`;
  let isSavedJS = false;

  try {
    if ('showSaveFilePicker' in window) {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'DATA.js',
        types: [{
          description: 'JavaScript Data File',
          accept: { 'application/javascript': ['.js'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(jsContent);
      await writable.close();
      isSavedJS = true;
    } else {
      const jsBlob = new Blob([jsContent], { type: 'application/javascript;charset=utf-8' });
      const aJs = document.createElement('a');
      aJs.href = URL.createObjectURL(jsBlob);
      aJs.download = 'DATA.js';
      aJs.click();
      URL.revokeObjectURL(aJs.href);
      isSavedJS = true;
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      gINFO34.innerHTML = `⚠️ 已備份 ${downloadFN}，但取消覆蓋 DATA.js`;
    } else {
      console.error('儲存 DATA.js 發生錯誤：', err);
      gINFO34.innerHTML = `❌ 覆蓋 DATA.js 失敗`;
    }
    return; // 取消或失敗時不自動重新整理頁面
  }

  // 5. 成功後更新 UI 並重新整理
  if (isSavedJS) {
    B30.style.backgroundColor = ""; 
    T31.innerHTML = ''; 
    T30.innerHTML = DTime;
    gINFO34.innerHTML = `✅ 已匯出 ${downloadFN} 與 DATA.js`; 
    
    isManualReloading = true; // 鎖定，避免 reload 觸發 pagehide 改動剛存好的 DTime1
    setTimeout(() => { window.location.reload(); }, 1500);
  }
}

// C16 loJN() ⬇️ DL 從外部備份檔還原資料 --------------
function loJN() 
{ 
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".json";
  fileInput.onchange = function(e) 
  { const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt)
    { try 
      { const importedData = JSON.parse(evt.target.result);
        if (typeof importedData !== 'object' || importedData === null)
          { throw new Error("檔案格式不是合法的 JSON 物件"); }
          localStorage.clear();
          Object.keys(importedData).forEach(k =>
            { localStorage.setItem(k, importedData[k]);  });
          const regex = /^(2025|2026)\d{2}$/; // YYYYMM
          const allKeys = Object.keys(localStorage || {});
          RecMn = allKeys.filter(key => regex.test(key));
          RecMn.sort();
          RecMni= RecMn.length - 1;
          RecEnd = true;
          RList = RecMn.join(' ');
          mLast  = RecMn.at(-2);
          mThis  = RecMn.at(-1);
          mNext  = Number(mThis) + ((mThis.slice(-2)=='12') ? 89:1) + '';
          MO     = `${mNext.slice(0,4)}-${mNext.slice(4)}`;
          DSrc   = 'F';
          DTime  = localStorage.getItem('DTime');
          DTime1 = localStorage.getItem('DTime1');
          isTxtChg = DTime !== DTime1;
          TxtOld    = localStorage.getItem(mThis);
          TxtNew = localStorage.getItem('TxtNew');
          RM1    = localStorage.getItem(mLast);
          RM2    = TxtNew;
          gData();
          gINFO34.innerHTML = `⬇️ 成功自備份檔 ${file.name} 還原！正在嘗試更新畫面...`;
          
          try { window.location.reload(true); } 
          catch(e) 
           { console.log("瀏覽器不支援此重整語法"); }
          setTimeout(() => 
            { console.log("⚠️ 重整未成功或被 App 攔截，啟動備用方案：強制退出...");
            gINFO34.innerHTML = `⬇️ App 限制重整，正在自動退出網頁...`;
            window.close(); // 嘗試關閉視窗
            setTimeout(() =>
              { gINFO34.innerHTML = 
                  ` <div style="background:#fff3cd; color:#856404;
                  padding:15px; border-radius:5px; text-align:center;
                  font-weight:bold; border:1px solid #ffeeba; font-size:16px;">
                  ✅ 資料已成功還原！<br>
                  請【手動關閉】此畫面，重新打開即可看到最新資料。
                  </div>`; }, 500);
            }, 500); // 這裡設定 500 毫秒（0.5秒），給重整一點反應時間
      } 
    catch (err)
      { console.error(err);
        gINFO34.innerHTML =
         `<span style="color:red">❌ 還原失敗: ${err.message}</span>`;
          alert(`還原失敗，請檢查 JSON 檔案內容是否正確。\n錯誤訊息: ${err.message}`); }
    };
  reader.readAsText(file);
  };
  fileInput.click();
}

// 🟢 核心優化：輕量級 Myers Diff 演算法 (用於精準比對字元)
// C18 getTextDiff() ----------------------------------
function getTextDiff(oldStr, newStr) 
{
  let matrix = Array(oldStr.length + 1).fill(null).map(() =>
    Array(newStr.length + 1).fill(0));
  for (let i = 1; i <= oldStr.length; i++)
    { for (let j = 1; j <= newStr.length; j++)
      { if (oldStr[i - 1] === newStr[j - 1])
        { matrix[i][j] = matrix[i - 1][j - 1] + 1; }
        else
        { matrix[i][j] = Math.max(matrix[i - 1][j], matrix[i][j - 1]); }
      }
    }
  let i = oldStr.length, j = newStr.length;
  let result = [];
  while (i > 0 || j > 0) 
    { if (i > 0 && j > 0 && oldStr[i - 1] === newStr[j - 1])
      { result.unshift({ type: 'equal', value: oldStr[i - 1] });
        i--; j--; }
      else if (j > 0 && (i === 0 || matrix[i][j - 1] >= matrix[i - 1][j])) 
      { result.unshift({ type: 'insert', value: newStr[j - 1] });
        j--; }
      else
      { result.unshift({ type: 'delete', value: oldStr[i - 1] });
        i--; }
    }
  return result;
}

//  判斷 jQuery 是否存在
window.addEventListener('load', function() 
{ const checker = document.getElementById('jquery-checker');
  if (typeof window.jQuery === 'undefined')
  { checker.style.backgroundColor = '#fff3f3';
    checker.style.border = '1px solid #ffcdd2';
    checker.style.color = '#c62828';
    checker.innerHTML = '❌ <b>jQuery 狀態：</b> 載入失敗！所有備援皆無法連接。';
    return; }
  const version = window.jQuery.fn.jquery;
  let detectedSrc = '未知來源';
  let isCached = false;
  const resources = performance.getEntriesByType('resource');
  const jqResource = resources.find(r => r.name.toLowerCase().includes('jquery'));
  if (jqResource) 
  { const url = jqResource.name;
    if (url.includes('://cloudflare.com')) 
    { detectedSrc = '🌐 Cloudflare CDN'; }
    else if (url.includes('://googleapis.com'))
    { detectedSrc = '🌐 Google CDN'; }
    else if (url.includes('jquery.com') &&
      !url.includes('cdnjs') && !url.includes('google'))
    { detectedSrc = '🌐 jQuery 官網 (首頁錯誤網址)'; }
    else if (url.startsWith('file://') ||
      url.startsWith('content://') || url.includes('jquery.min.js'))
    { detectedSrc = '📁 本地檔案 (Local File)'; }
    else
    { detectedSrc = url; }
    if (jqResource.transferSize === 0 && jqResource.encodedBodySize > 0)
    { isCached = true; } }
    else
    { detectedSrc = '🧠 瀏覽器內存暫存 (RAM / Memory Session)';
    isCached = true; }
  checker.style.backgroundColor = '#e8f5e9';
  checker.style.border = '1px solid #c8e6c9';
  checker.style.color = '#2e7d32';
  checker.innerHTML = `
    ✅ <b>jQuery  v${version} </b>載入成功！<br>
    🔹 <b>載入來源：</b> ${detectedSrc}<br>
    🔹 <b>快取狀態：</b> ${isCached ? 
      '⚡ 來自快取 (Offline Cache/RAM)' : '📡 即時網路下載 (Live Network)'} `;
});
